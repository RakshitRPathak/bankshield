[project]
name = "bankshield"
version = "2.0.0"
description = "Bank cloud security intelligence: RAG over policy and live cloud state"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2", "pyyaml>=6", "numpy>=1.26", "scikit-learn>=1.4", "rank-bm25>=0.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
llm = ["openai>=1.30", "google-cloud-aiplatform>=1.50", "anthropic>=0.30", "sentence-transformers>=2.7"]
gcp = ["google-cloud-asset>=3.24", "google-cloud-logging>=3.10"]

[project.scripts]
bankshield = "bankshield.__main__:main"

[tool.setuptools.packages.find]
include = ["bankshield*"]

[tool.setuptools.package-data]
bankshield = ["detection/rules.yaml", "playbooks/library/*.yaml", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
